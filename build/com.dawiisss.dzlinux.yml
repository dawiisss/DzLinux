app-id: com.dawiisss.dzlinux
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: dzlinux
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --device=dri
  # Required to read DayZ Workshop mods and run Proton/SteamCMD from standard locations
  - --filesystem=~/.steam
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.local/share/SteamCMD
modules:
  - name: dzlinux
    buildsystem: simple
    build-commands:
      - install -d /app/main
      - cp -r * /app/main/
      - rm -f /app/main/dzlinux.sh
      - install -Dm755 dzlinux.sh /app/bin/dzlinux
    sources:
      - type: archive
        url: https://github.com/dawiisss/DzLinux/releases/download/v2.1.3/dzlinux-2.1.3.tar.gz
        sha256: 6998a45e636e99d8a02de9d5a2ee2ab9500b01ba54946ee8d151eeb31a651861
      - type: script
        dest-filename: dzlinux.sh
        commands:
          - zypak-wrapper /app/main/dzlinux "$@"
